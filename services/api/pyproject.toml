[project]
name = "adwatch-api"
version = "0.1.0"
description = "AdWatch data plane: SerpApi collectors, diff engine, AI analyst"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "anthropic>=0.40",
  "python-dateutil>=2.9",
  "PyJWT>=2.9",
  "reportlab>=4.2",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]  # E501: long lines ok; B008: FastAPI Depends() idiom

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
