name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: services/api/requirements.txt }
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1", NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api/v1" }

  e2e:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts builds and starts the app itself, and e2e/fixtures.ts
      # stubs both the data plane and the control plane, so no backend is needed.
      # Build as production does. NEXT_PUBLIC_* are baked in at build time, and with
      # AUTH_PROVIDER unset the app renders its "auth provider is none" branch — so the
      # login and password-reset specs would exercise a configuration that never ships.
      # e2e/fixtures.ts stubs both the data plane and the control plane, so no backend
      # is needed either way.
      - run: npx playwright test
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000/api/v1"
          NEXT_PUBLIC_AUTH_PROVIDER: "xano"
          NEXT_PUBLIC_XANO_BASE_URL: "https://stub.invalid/api:adwatch-control"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: apps/web/playwright-report/, retention-days: 7 }

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t adwatch-api ./services/api
      - run: docker build -t adwatch-web ./apps/web
